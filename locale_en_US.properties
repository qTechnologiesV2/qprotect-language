cli.help=\nUsage:\n  --config <file> [--input <file> ...] [--output <file> ...] [--import-pom <pom.xml>] [--api-key <key>] [--use-local-dir]\n  --save-default-config\n  --convert-config <file> --config-output <file.json> [--template]\n  --update-config [<file.json>]\n\nOptions:\n  -s, --save-default-config\n      Writes the default config (from resources) to default-config.json\n      and exits. Overwrites if the file already exists.\n\n  --update-config [<file>]\n      Updates an existing JSON config to the latest format while preserving\n      its values, then exits. Uses --config when <file> is omitted.\n\n  -l, --use-local-dir\n      Use a local directory for storage instead of user home.\n\n  -k, --api-key <key>\n      DRM API key. Uses the saved key (or prompts) when omitted.\n\n  -c, --config <file>\n      Path to a JSON configuration or read-only legacy TOML configuration.\n  --convert-config <file> --config-output <file.json> [--template]\n      Converts without authentication or obfuscation. Leaves the source intact.\n      --template exports only portable settings, without filling missing defaults.\n  -i, --input <file>\n      Overrides config inputs. Repeat once per input archive.\n  -o, --output <file>\n      Overrides config outputs. Repeat in the same order as inputs.\n  -p, --import-pom <pom.xml>\n      Resolves the POM's (transitive) dependencies, downloads the jars\n      and adds them to the libraries list.
