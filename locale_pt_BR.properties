cli.help=\nUso:\n  --config <file> [--input <file> ...] [--output <file> ...] [--import-pom <pom.xml>] [--api-key <key>] [--use-local-dir]\n  --save-default-config\n  --convert-config <file> --config-output <file.json> [--template]\n  --update-config [<file.json>]\n\nOpções:\n  -s, --save-default-config\n      Grava a configuração padrão (dos recursos) em default-config.json\n      e sai. Sobrescreve o arquivo se ele já existir.\n\n  --update-config [<file>]\n      Atualiza uma configuração JSON existente para o formato mais recente,\n      preservando seus valores, e sai. Usa --config quando <file> é omitido.\n\n  -l, --use-local-dir\n      Usa um diretório local para armazenamento em vez da pasta do usuário.\n\n  -k, --api-key <key>\n      Chave de API do DRM. Usa a chave salva (ou solicita uma) quando omitida.\n\n  -c, --config <file>\n      Caminho para uma configuração JSON ou uma configuração TOML legada (somente leitura).\n  --convert-config <file> --config-output <file.json> [--template]\n      Converte sem autenticação nem ofuscação. Mantém o arquivo de origem intacto.\n      --template exporta apenas configurações portáteis, sem preencher os padrões ausentes.\n  -i, --input <file>\n      Substitui as entradas da configuração. Repita uma vez para cada arquivo de entrada.\n  -o, --output <file>\n      Substitui as saídas da configuração. Repita na mesma ordem das entradas.\n  -p, --import-pom <pom.xml>\n      Resolve as dependências (transitivas) do POM, baixa os jars\n      e os adiciona à lista de bibliotecas.
